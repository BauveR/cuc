name: Release

# Al fusionar release/* o hotfix/* en main, release-please abre/actualiza
# un PR con CHANGELOG + versión SemVer; al fusionarlo crea el tag vX.Y.Z.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # crear tag y release
      pull-requests: write # abrir el PR de release
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
