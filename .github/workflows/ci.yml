name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Mínimo privilegio: el token solo puede leer el repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fijadas por SHA (inmutables) frente a ataques de supply-chain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile estricto, sin scripts de terceros)
        run: npm ci --ignore-scripts

      - name: Política — ningún workflow usa secretos
        run: |
          if grep -rnE '\$\{\{\s*secrets\.' .github/workflows; then
            echo "::error::Los workflows no deben usar secrets.*"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck

      # Con cobertura: el umbral del 80 % (vite.config.ts) también se aplica en CI.
      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Informe de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - run: npm run build
      - name: Presupuesto del modelo 3D (si existe)
        run: npm run models:check

      - name: Audit dependencias de runtime (moderate+)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit árbol completo (high+)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 oficial de gitleaks_8.30.1_linux_x64.tar.gz (checksums.txt del release)
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo
          persist-credentials: false

      # Binario oficial con checksum verificado, en vez de gitleaks-action:
      # la acción escanea `<primer>^..<último>` y falla en el commit raíz.
      - name: Install gitleaks (checksum verificado)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .'
